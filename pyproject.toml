[project]
requires-python=">= 3.10"
name = "papers-please-kp"
version = "0.1.0"

license = "GPL-3.0-or-later"

dependencies = [
	"UnityPy >= 1.25.3",
]

[dependency-groups]
dev = [
	"basedpyright >= 1.40.1",
	"ruff         >= 0.16.8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
package = false

[tool.basedpyright]
venvPath = "."
venv = ".venv"

[tool.ruff]
target-version = "py310"
line-length = 88
indent-width = 3

[tool.ruff.format]
indent-style = "tab"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]
